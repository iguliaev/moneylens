<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your MoneyLens Verification Code</title>
</head>
<body style="margin:0; padding:0; background-color:#F7F9FC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F7F9FC;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="{{ .SiteURL }}/email-logo.png" width="220" alt="MoneyLens" style="display:block; width:220px; max-width:80%; height:auto; border:0;">
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff; border:1px solid #e5e7eb; border-radius:10px; padding:32px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
              <h1 style="margin:0 0 16px; font-size:20px; line-height:1.3; color:#1F2A37; font-weight:700; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">Verify it's you</h1>
              <p style="margin:0 0 16px; font-size:15px; line-height:1.6; color:#1F2A37; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">Enter this code to continue with this action on MoneyLens:</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0 24px;">
                <tr>
                  <td align="center" style="background-color:#E8F1FA; border-radius:10px; padding:20px;">
                    <span style="font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size:32px; font-weight:700; letter-spacing:8px; color:#185FA5;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:0; font-size:13px; line-height:1.5; color:#6B7280; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">This code expires in 1 hour. If you didn't request this, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0; font-size:12px; color:#9CA3AF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">MoneyLens &middot; TRACK. BUDGET. UNDERSTAND.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
